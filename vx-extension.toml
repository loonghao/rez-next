[extension]
name = "rez-release"
version = "0.1.0"
description = "Run rez-next package releases (release/local/dry-run) through vx"
type = "command"
authors = ["rez-next contributors"]
license = "Apache-2.0"

[runtime]
requires = "python >= 3.9"

[entrypoint]
main = "scripts/release.py"

# Do NOT add `[[entrypoint.arguments]]` here.
#
# When an entrypoint declares arguments, vx parses the bare-entrypoint flags
# itself and passes them as VX_ARG_* environment variables instead of
# forwarding argv to the script. The script then sees an empty argv, every
# argparse flag falls back to its default, and `vx x rez-release --dry-run`
# silently becomes a real release: it builds, installs, and creates a VCS tag.
# Neither `--` nor unknown flags escape this — vx rejects undeclared flags
# before the script runs.
#
# Leaving the table out keeps argv passthrough intact and makes the script's
# own argparse the single source of truth for flags (bad usage still exits 2).
# Guarded by a regression test in tests/scripts/test_extension_manifest.py.

[commands.release]
description = "Release a rez package from a source directory"
script = "scripts/release.py"

[commands.check]
description = "Validate a package without releasing it (alias for --dry-run)"
script = "scripts/release.py"
args = ["--dry-run"]

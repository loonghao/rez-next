[package]
name = "rez-next-common"
version = "0.3.12" # x-release-please-version
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "Common utilities and types for Rez Core"
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[lib]
name = "rez_next_common"
crate-type = ["rlib"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
thiserror.workspace = true
rez-next-config = { version = "0.3.12", path = "../rez-next-config" } # x-release-please-version

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true

# RezCoreConfig is marked #[non_exhaustive] so that modelling further upstream
# settings stays additive: the attribute disables constructible_struct_adds_field
# permanently. Marking it is itself a one-off major break, which is the debt
# this crate owes until the next minor bump. Downgraded to a warning rather
# than allowed, so the debt stays visible in CI output.
[package.metadata.cargo-semver-checks.lints]
struct_marked_non_exhaustive = "warn"

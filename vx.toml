[tools]
# `rust` is intentionally absent. vx resolves `cargo`/`rustc` through its own
# store, which ignored the pinned channel: on a clean runner it installed the
# `stable` channel, switched the rustup default to it, and every `vx just ...`
# job silently ran on that toolchain instead of the pinned one. Rust now comes
# from rustup only, driven by rust-toolchain.toml (local) or RUSTUP_TOOLCHAIN
# (CI); see scripts/check_toolchain_pins.py.
actionlint = "latest"
cargo-llvm-cov = "latest"
just = "latest"
maturin = "latest"
python = "3.14.4"
uv = "latest"

[settings]
# Automatically install missing tools when entering dev environment
auto_install = true
# Cache duration for version checks
cache_duration = "7d"

[scripts]
actionlint = "just actionlint"
bench = "cargo bench"
build = "just build"
build-bin = "just build-bin"
build-release = "cargo build --release"
check = "cargo check"
ci = "just ci"
clean = "just clean"
cli-e2e = "just cli-e2e"
cli-e2e-one = "just cli-e2e-one"
cli-e2e-release = "just cli-e2e-release"
default = "just default"
doc = "just doc"
doc-check = "just doc-check"
fmt = "just fmt"
fmt-check = "just fmt-check"
format = "cargo fmt"
install = "just install"
lint = "just lint"
lint-ci = "just lint-ci"
pre-commit = "just pre-commit"
pre-commit-install = "just pre-commit-install"
pre-commit-staged = "just pre-commit-staged"
pre-commit-update = "just pre-commit-update"
py-build = "just py-build"
py-ci = "just py-ci"
py-fmt = "just py-fmt"
py-lint = "just py-lint"
py-test = "just py-test"
py-test-e2e = "just py-test-e2e"
py-test-fast = "just py-test-fast"
py-test-module = "just py-test-module"
run = "just run"
semver-check = "just semver-check"
test = "just test"
test-verbose = "just test-verbose"

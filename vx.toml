[tools]
# `rust` is intentionally absent. vx resolves `cargo`/`rustc` through its own
# store, which ignored the pinned channel: on a clean runner it installed the
# `stable` channel, switched the rustup default to it, and every `vx just ...`
# job silently ran on that toolchain instead of the pinned one. Rust now comes
# from rustup only, driven by rust-toolchain.toml (local) or RUSTUP_TOOLCHAIN
# (CI); see scripts/check_toolchain_pins.py.
actionlint = "latest"
cargo-llvm-cov = "latest"
just = "latest"
maturin = "latest"
python = "3.14.4"
uv = "latest"

[settings]
# Automatically install missing tools when entering dev environment
auto_install = true
# Cache duration for version checks
cache_duration = "7d"

# No [scripts] here on purpose: every entry was a verbatim `just xxx` mirror of
# a justfile recipe, so the two copies drifted silently whenever a recipe was
# renamed. Run `just <recipe>` instead.
#
# Three entries shadowed a same-named recipe with a different body and are now
# served by that recipe: `bench`, `build-release` and `check` (`check` was
# `cargo check`; `just check` is the aggregate `fmt-check lint test`).
# `format = "cargo fmt"` is covered by the existing `fmt` recipe.
